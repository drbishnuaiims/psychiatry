name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenerates the index and sitemap inside the runner only; nothing is committed back.
      - name: Build index and sitemap
        run: npm run build

      - name: Validate index
        run: npm run validate

      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a \
            --exclude='/_site' --exclude='/.git' --exclude='/.github' --exclude='/.vscode' \
            --exclude='/node_modules' --exclude='.DS_Store' --exclude='/.gitignore' \
            --exclude='/manage.sh' --exclude='/scripts' --exclude='/package*.json' \
            --exclude='/README.txt' --exclude='/PROJECT_INVENTORY.txt' --exclude='/code' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/data/generated-guidelines.js
          test -f _site/data/guidelines.js
          test -d _site/assets
          test ! -e _site/.git

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
